apiVersion: v1
kind: PersistentVolume
metadata:
  name: postgresql-pv
  labels:
    app.kubernetes.io/name: postgresql
    app.kubernetes.io/part-of: local-ai-flowise
spec:
  capacity:
    storage: 30Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: manual
  hostPath:
    path: /data/local-ai/postgresql
    type: DirectoryOrCreate
