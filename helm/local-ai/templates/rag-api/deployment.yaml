{{- if .Values.ragApi.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rag-api
  labels:
    app.kubernetes.io/name: rag-api
    app.kubernetes.io/part-of: local-ai
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: rag-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rag-api
        app.kubernetes.io/part-of: local-ai
    spec:
      containers:
        - name: rag-api
          image: "{{ .Values.ragApi.image.repository }}:{{ .Values.ragApi.image.tag }}"
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: RAG_PORT
              value: "8000"
            - name: VECTOR_DB_TYPE
              value: pgvector
            - name: DB_HOST
              value: postgresql
            - name: DB_PORT
              value: "5432"
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgresql.existingSecret }}
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgresql.existingSecret }}
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgresql.existingSecret }}
                  key: POSTGRES_PASSWORD
            - name: EMBEDDINGS_PROVIDER
              value: openai
            - name: RAG_OPENAI_BASEURL
              value: {{ .Values.ragApi.embeddings.baseUrl | quote }}
            - name: RAG_OPENAI_API_KEY
              value: "not-needed"
            - name: EMBEDDINGS_MODEL
              value: {{ .Values.ragApi.embeddings.model | quote }}
            {{- range $k, $v := .Values.ragApi.extraEnv }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          resources:
            {{- toYaml .Values.ragApi.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: rag-api
  labels:
    app.kubernetes.io/name: rag-api
    app.kubernetes.io/part-of: local-ai
spec:
  selector:
    app.kubernetes.io/name: rag-api
  ports:
    - name: http
      port: 8000
      targetPort: http
{{- end }}
