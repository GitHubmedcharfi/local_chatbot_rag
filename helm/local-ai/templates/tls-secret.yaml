{{- if .Values.tls.enabled }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace .Values.tls.secretName }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.tls.secretName }}
  labels:
    app.kubernetes.io/part-of: local-ai
type: kubernetes.io/tls
data:
  {{- if $existing }}
  tls.crt: {{ index $existing.data "tls.crt" | quote }}
  tls.key: {{ index $existing.data "tls.key" | quote }}
  {{- else }}
  {{- $cert := genSelfSignedCert .Values.tls.host nil (list .Values.tls.host) 825 }}
  tls.crt: {{ $cert.Cert | b64enc | quote }}
  tls.key: {{ $cert.Key | b64enc | quote }}
  {{- end }}
{{- end }}
