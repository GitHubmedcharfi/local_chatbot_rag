{{- if .Values.librechat.enabled }}
{{- $name := "librechat-credentials-env" }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    app.kubernetes.io/part-of: local-ai
type: Opaque
data:
  {{- if $existing }}
  CREDS_KEY: {{ index $existing.data "CREDS_KEY" | quote }}
  CREDS_IV: {{ index $existing.data "CREDS_IV" | quote }}
  JWT_SECRET: {{ index $existing.data "JWT_SECRET" | quote }}
  JWT_REFRESH_SECRET: {{ index $existing.data "JWT_REFRESH_SECRET" | quote }}
  MEILI_MASTER_KEY: {{ index $existing.data "MEILI_MASTER_KEY" | quote }}
  {{- else }}
  CREDS_KEY: {{ randAlphaNum 32 | sha256sum | b64enc | quote }}
  CREDS_IV: {{ randAlphaNum 32 | sha256sum | trunc 32 | b64enc | quote }}
  JWT_SECRET: {{ randAlphaNum 48 | b64enc | quote }}
  JWT_REFRESH_SECRET: {{ randAlphaNum 48 | b64enc | quote }}
  MEILI_MASTER_KEY: {{ randAlphaNum 32 | b64enc | quote }}
  {{- end }}
{{- end }}
