global:
  labels:
    app.kubernetes.io/part-of: local-ai

# ---------- LibreChat (official chart, used as a dependency) ----------
librechat:
  enabled: true

  # Meilisearch (conversation search) is not needed on a small CPU VM
  meilisearch:
    enabled: false

  # MongoDB subchart bundled with the LibreChat chart
  mongodb:
    persistence:
      size: 10Gi

  # LibreChat application settings
  librechat:
    configEnv:
      ADMIN_PANEL_URL: ""
      SEARCH: "false"

# ---------- PostgreSQL + pgvector (own templates) ----------
postgresql:
  enabled: true
  image:
    repository: pgvector/pgvector
    tag: pg16
  # Secret is generated by Helm on first install and reused on upgrades.
  createSecret: true
  existingSecret: postgresql-secret
  auth:
    username: raguser
    database: ragdb
    password: ""        # empty = random, generated once
  persistence:
    size: 30Gi
    storageClass: ""
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi

# ---------- llama.cpp servers (own templates) ----------
llmInit:
  image: curlimages/curl:8.10.1

llm:
  chat:
    enabled: true
    embeddings: false
    image:
      repository: ghcr.io/ggml-org/llama.cpp
      tag: server            # TODO: pin a versioned tag after first run
    model:
      url: https://huggingface.co/Qwen/Qwen2.5-1.5B-Instruct-GGUF/resolve/main/qwen2.5-1.5b-instruct-q4_k_m.gguf
      file: qwen2.5-1.5b-instruct-q4_k_m.gguf
      alias: local-chat
    threads: 3
    contextSize: 4096
    extraArgs: []
    persistence:
      size: 5Gi
      storageClass: ""
    resources:
      requests:
        cpu: "1"
        memory: 1536Mi
      limits:
        cpu: "3"
        memory: 2Gi

  embed:
    enabled: false           # turned on in step 2.8
    embeddings: true
    image:
      repository: ghcr.io/ggml-org/llama.cpp
      tag: server            # TODO: pin
    model:
      url: ""
      file: ""
      alias: local-embed
    threads: 1
    contextSize: 2048
    extraArgs: []
    persistence:
      size: 2Gi
      storageClass: ""
    resources:
      requests:
        cpu: 500m
        memory: 512Mi
      limits:
        cpu: "1"
        memory: 1Gi

# ---------- NodePort access to LibreChat ----------
nodePort:
  enabled: false
  port: 30080
  selector: {}

# ---------- TLS secret (self-signed) ----------
tls:
  enabled: false
  secretName: librechat-tls
  host: ""
