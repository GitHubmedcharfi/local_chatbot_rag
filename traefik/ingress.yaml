apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: librechat
  namespace: local-ai
  labels:
    app.kubernetes.io/name: librechat
    app.kubernetes.io/part-of: local-ai-librechat
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  ingressClassName: traefik
  tls:
    - secretName: librechat-tls
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: librechat
                port:
                  number: 3080
