apiVersion: apps/v1
kind: Deployment
metadata:
  name: rag-api
  namespace: local-ai
  labels:
    app.kubernetes.io/name: rag-api
    app.kubernetes.io/part-of: local-ai-librechat
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: rag-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rag-api
        app.kubernetes.io/part-of: local-ai-librechat
    spec:
      containers:
        - name: rag-api
          image: ghcr.io/danny-avila/librechat-rag-api-dev-lite:latest
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: rag-api-config
            - secretRef:
                name: postgresql-secret
          env:
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: librechat-secret
                  key: JWT_SECRET
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
